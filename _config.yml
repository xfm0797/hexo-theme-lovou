# Hexo 站点配置
# 文档: https://hexo.io/zh-cn/docs/configuration.html

title: 墨痕
subtitle: 极简 · 现代 · 中文
description: 一个基于 Hexo 的极简现代风中文博客
keywords: 博客, Hexo, 极简, 现代
author: lovou
language: zh-CN
timezone: Asia/Shanghai

# URL
# GitHub Pages 部署地址（绑定自定义域名时改回 https://lovou.pw 并删除 root 行）
url: https://xfm0797.github.io/hexo-theme-lovou
root: /hexo-theme-lovou/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# 目录
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
# Decap CMS 管理界面按原样复制，不做模板渲染
skip_render: admin/*

# 文章
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

# 代码高亮（服务端渲染，主题 CSS 已内置配色）
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: " "
  wrap: true

# 首页 / 分页
index_generator:
  path: ""
  per_page: 10
  order_by: -date

default_category: 未分类
category_map:
tag_map:

# 归档
archive_generator:
  enabled: true
  per_page: 0
  yearly: true
  monthly: true

# 标签
tag_generator:
  per_page: 10

# 日期格式
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# 分页目录
pagination_dir: page

# 主题
theme: lovou

# 部署
deploy:
  type: ""

# Hexo 博客自动部署到 GitHub Pages
# 使用官方 Pages Actions（actions/deploy-pages），无需配置 SSH 密钥
# 使用方法见 README.md「自动部署」章节

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch: # 支持手动触发

# 同一时间只保留一个部署任务，取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

# Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Hexo
        # 通过 _config.github.yml 覆盖 url/root 为 GitHub Pages 子路径；
        # 本地 / EdgeOne Pages / Cloudflare Pages 使用根路径默认配置，互不干扰
        run: |
          npx hexo clean --config _config.yml,_config.github.yml
          npx hexo generate --config _config.yml,_config.github.yml

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

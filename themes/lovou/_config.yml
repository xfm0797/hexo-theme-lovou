# lovou 主题配置

# 导航菜单
menu:
  - name: 首页
    link: /
  - name: 归档
    link: /archives
  - name: 分类
    link: /categories
  - name: 标签
    link: /tags
  - name: 关于
    link: /about
  - name: 友链
    link: /links

# 文章页是否显示目录（单篇文章可在 front-matter 中写 toc: false 关闭）
toc: true

# 文末分享按钮（文章默认开启，单篇可写 share: false 关闭；页面需写 share: true 开启）
share: true

# Open Graph 默认分享图（文章无图时使用；建议 1200x630，放在 source/images/ 下）
og:
  image: /images/og-default.png

# 是否显示字数与阅读时长
word_count: true

# 文章底部版权声明（留空则不显示）
license: '本文采用 <a href="https://creativecommons.org/licenses/by/4.0/deed.zh" target="_blank" rel="noopener">CC BY 4.0</a> 许可协议发布'

# 页脚附加文字（如备案号，支持 HTML，留空则不显示）
footer: ''

# 页脚右侧「我的网站」链接（名称 + 链接，留空则整块不显示）
footer_links:
  - name: 域名
    link: https://host.xongyi.com
  - name: 网盘
    link: https://pan.lovou.pw
  - name: 图库
    link: https://img.lovou.eu.org
  - name: 开源
    link: https://github.com/xfm0797

# 评论系统：将 enable 改为 true，并填写所选平台（type）的配置后生效
# 支持：giscus / waline / gitalk / disqus
# 文章页默认开启（单篇可在 front-matter 写 comments: false 关闭）
# 自定义页面需在 front-matter 写 comments: true 开启
comments:
  enable: true
  type: waline

  # Giscus — 基于 GitHub Discussions（推荐）https://giscus.app/zh-CN
  giscus:
    repo:
    repo-id:
    category: Announcements
    category-id:
    mapping: title
    reactions-enabled: 1
    lang: zh-CN

  # Waline https://waline.js.org
  waline:
    server-url: https://waline.xfm.qzz.io
    lang: zh-CN

  # Gitalk — 基于 GitHub Issues
  gitalk:
    client-id:
    client-secret:
    repo:
    owner:
    admin: []

  # Disqus https://disqus.com
  disqus:
    shortname:

# Google AdSense 广告
# 填写 client（发布商 ID）并开启 enable 后，主题会自动完成三件事：
#   1. 在页面 <head> 注入 AdSense 脚本（全站统一加载一次）
#   2. 按下面的 slot 在首页文章列表、文章正文顶部/底部渲染广告单元
#   3. 生成 /ads.txt（Google 建议的站点授权声明）
# 各广告位的 slot 留空则该位置不渲染，方便逐个上线、随时回退。
adsense:
  # 总开关：需同时满足 enable 为 true 且 client 已填写才会生效
  enable: false
  # 发布商 ID，形如 ca-pub-1234567890123456（AdSense 后台「账号」页可查）
  client: ''
  # 是否自动生成 /ads.txt
  ads_txt: true
  # 首页文章列表：每隔 N 篇插入一个广告（0 = 不插入）
  index_every: 0
  # 首页列表广告单元 ID（对应 AdSense 广告单元代码里的 data-ad-slot）
  index_slot: ''
  # 文章页正文顶部广告单元 ID
  post_top_slot: ''
  # 文章页正文底部广告单元 ID（正文之后、标签之前）
  post_bottom_slot: ''
  # 广告单元默认格式：auto / horizontal / rectangle / vertical
  format: auto
  # 是否为自适应全宽
  full_width_responsive: true

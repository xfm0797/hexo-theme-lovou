# lovou 主题配置

# 导航菜单
menu:
  - name: 首页
    link: /
  - name: 归档
    link: /archives
  - name: 分类
    link: /categories
  - name: 标签
    link: /tags
  - name: 关于
    link: /about
  - name: 友链
    link: /links

# 文章页是否显示目录（单篇文章可在 front-matter 中写 toc: false 关闭）
toc: true

# 文末分享按钮（文章默认开启，单篇可写 share: false 关闭；页面需写 share: true 开启）
share: true

# Open Graph 默认分享图（文章无图时使用；建议 1200x630，放在 source/images/ 下）
og:
  image: /images/og-default.png

# 是否显示字数与阅读时长
word_count: true

# 文章底部版权声明（留空则不显示）
license: '本文采用 <a href="https://creativecommons.org/licenses/by/4.0/deed.zh" target="_blank" rel="noopener">CC BY 4.0</a> 许可协议发布'

# 页脚附加文字（如备案号，支持 HTML，留空则不显示）
footer: ''

# 页脚右侧「我的网站」链接（名称 + 链接，留空则整块不显示）
footer_links:
  - name: 域名
    link: https://host.xongyi.com
  - name: 网盘
    link: https://pan.lovou.pw
  - name: 图库
    link: https://img.lovou.eu.org
  - name: 开源
    link: https://github.com/xfm0797

# 评论系统：将 enable 改为 true，并填写所选平台（type）的配置后生效
# 支持：giscus / waline / gitalk / disqus
# 文章页默认开启（单篇可在 front-matter 写 comments: false 关闭）
# 自定义页面需在 front-matter 写 comments: true 开启
comments:
  enable: true
  type: waline

  # Giscus — 基于 GitHub Discussions（推荐）https://giscus.app/zh-CN
  giscus:
    repo:
    repo-id:
    category: Announcements
    category-id:
    mapping: title
    reactions-enabled: 1
    lang: zh-CN

  # Waline https://waline.js.org
  waline:
    server-url: https://waline.xfm.qzz.io
    lang: zh-CN

  # Gitalk — 基于 GitHub Issues
  gitalk:
    client-id:
    client-secret:
    repo:
    owner:
    admin: []

  # Disqus https://disqus.com
  disqus:
    shortname:
